name: GlamSt
description: >-
  GlamSt (GlamST LLC) builds customized virtual makeover and try-on solutions
  for beauty brands and retailers, combining augmented reality (AR), artificial
  intelligence, and machine learning to power virtual makeup and cosmetics
  try-on across mobile, web, and in-store experiences. Founded with offices in
  San Francisco, Montevideo (Uruguay), and Wilmington (Delaware), the company
  was surfaced as a portfolio company of 500 Global and added to the API
  Evangelist network. GlamSt was acquired by Ulta Beauty in 2018 and integrated
  into Ulta's digital innovation team; it exposes no public developer portal,
  API, SDK, or documentation surface, so this profile is identity-only.
